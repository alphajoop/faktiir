version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Africa/Dakar"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Root (turbo, biome, typescript)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Africa/Dakar"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      tooling:
        patterns:
          - "turbo"
          - "@biomejs/*"
          - "typescript"

  # API (NestJS, Prisma, Puppeteer…)
  - package-ecosystem: "bun"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Africa/Dakar"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "api"
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      puppeteer:
        patterns:
          - "puppeteer"
          - "puppeteer-core"
          - "@sparticuz/*"

  # Web (Next.js, React, shadcn, Radix…)
  - package-ecosystem: "bun"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Africa/Dakar"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      nextjs:
        patterns:
          - "next"
          - "next-themes"
      tanstack:
        patterns:
          - "@tanstack/*"
      radix:
        patterns:
          - "radix-ui"
          - "@radix-ui/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
          - "tailwind-merge"
          - "class-variance-authority"
